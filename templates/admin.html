<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:#0a1929;color:#fff;padding-bottom:30px;min-height:100vh}
header{background:linear-gradient(90deg,#0f2027,#2c5364);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:17px}
header .info{font-size:11px;color:#ffd200;margin-top:3px}
header .logout{color:#fff;text-decoration:none;font-size:12px;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px}
.tabs{display:flex;gap:4px;padding:10px;overflow-x:auto;background:#0f2027}
.tab{padding:8px 14px;background:rgba(255,255,255,0.06);border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;white-space:nowrap;border:2px solid transparent;color:#a0b8c4}
.tab.active{background:linear-gradient(90deg,#f7971e,#ffd200);color:#0f2027;border-color:#f7971e}
.container{padding:14px;max-width:820px;margin:0 auto}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;margin-bottom:12px}
.label{color:#7a9bab;font-size:11px}
.phone{font-size:16px;font-weight:bold;color:#ffd200;direction:ltr}
.name{color:#fff;font-size:14px;margin-top:3px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold;white-space:nowrap}
.pending{background:#5d4a00;color:#ffd200}
.approved{background:#1b5e20;color:#a5d6a7}
.rejected{background:#b71c1c;color:#ef9a9a}
.active-b{background:#1b5e20;color:#a5d6a7}
.expired-b{background:#b71c1c;color:#ef9a9a}
.open-b{background:#1b5e20;color:#a5d6a7}
.closed-b{background:#b71c1c;color:#ef9a9a}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;font-family:Tahoma}
.btn-ok{background:#25D366;color:#fff}
.btn-no{background:#e53935;color:#fff}
.btn-blue{background:#2c5364;color:#fff}
.btn-gold{background:linear-gradient(90deg,#f7971e,#ffd200);color:#0f2027}
.btn-sm{padding:6px 10px;font-size:11px}
.img-box{margin-top:10px}
.img-box img{max-width:100%;max-height:280px;border-radius:10px;border:2px solid rgba(255,255,255,0.1);cursor:pointer}
.img-box a{color:#ffd200;text-decoration:none;font-size:13px;font-weight:bold}
.money{background:rgba(255,210,0,0.1);border-right:3px solid #ffd200;padding:10px;border-radius:8px;margin-top:10px}
.money label{font-size:12px;color:#ffd200;display:block;margin-bottom:4px}
.money input{width:100%;padding:10px;border:2px solid rgba(255,210,0,0.3);background:rgba(0,0,0,0.3);color:#fff;border-radius:8px;font-size:15px;font-family:Tahoma}
.empty{text-align:center;color:#5a7a8a;padding:40px;font-size:13px}
.hidden{display:none}
input,textarea{width:100%;padding:11px;border:2px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#fff;border-radius:8px;margin-bottom:8px;font-size:14px;font-family:Tahoma}
textarea{min-height:70px;resize:vertical}
.add-form{background:rgba(255,255,255,0.03);border:2px dashed rgba(255,210,0,0.3);border-radius:12px;padding:16px;margin-bottom:16px}
.add-form h3{margin-bottom:12px;color:#ffd200;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:start;gap:8px;flex-wrap:wrap}
.stat-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;text-align:center}
.stat .num{font-size:26px;font-weight:bold;color:#ffd200;margin-bottom:4px}
.stat .lbl{font-size:11px;color:#7a9bab}
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;text-align:center}
.ch-card.open{border-color:rgba(37,211,102,0.4);background:rgba(37,211,102,0.08)}
.ch-card.closed{border-color:rgba(229,57,53,0.4);background:rgba(229,57,53,0.08)}
.ch-card .name{font-size:13px;font-weight:bold;color:#fff;margin:6px 0}
.ch-card .status{font-size:10px;font-weight:bold;padding:3px 8px;border-radius:12px;display:inline-block}
.ch-card .status.open-b{background:#1b5e20;color:#a5d6a7}
.ch-card .status.closed-b{background:#b71c1c;color:#ef9a9a}
.ch-card .btns{display:flex;gap:4px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.issue-card{background:rgba(229,57,53,0.1);border:1px solid rgba(229,57,53,0.3);border-radius:12px;padding:14px;margin-bottom:10px}
.issue-card .ch{color:#ffd200;font-weight:bold;font-size:15px;margin-bottom:6px}
.issue-card .msg{background:rgba(0,0,0,0.3);padding:10px;border-radius:8px;font-size:14px;line-height:1.7;margin:8px 0}
.bulk{background:linear-gradient(135deg,rgba(247,151,30,0.2),rgba(255,210,0,0.1));border:2px solid rgba(255,210,0,0.4);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center}
.bulk h3{color:#ffd200;font-size:15px;margin-bottom:8px}
</style>
</head>
<body>

<header>
<div>
<h1>🏆 لوحة تحكم Star Sport</h1>
<div class="info">أهلاً {{ admin_name }}</div>
</div>
<a href="/admin/logout" class="logout">خروج</a>
</header>

<div class="tabs">
<div class="tab active" onclick="tab('requests',this)">📥 الطلبات</div>
<div class="tab" onclick="tab('users',this)">👥 المشتركين</div>
<div class="tab" onclick="tab('channels',this)">📺 القنوات</div>
<div class="tab" onclick="tab('issues',this)">⚠️ المشاكل</div>
<div class="tab" onclick="tab('stats',this)">📊 إحصائيات</div>
</div>

<div class="container">
<div id="requestsView"></div>
<div id="usersView" class="hidden"></div>
<div id="channelsView" class="hidden"></div>
<div id="issuesView" class="hidden"></div>
<div id="statsView" class="hidden"></div>
</div>

<script>
async function loadRequests() {
    var r = await fetch('/api/admin/requests');
    var d = await r.json();
    var b = document.getElementById('requestsView');
    if (!d.length) { b.innerHTML = '<div class="empty">مفيش طلبات</div>'; return; }
    b.innerHTML = d.map(function(x) {
        var img = x.screenshot ? '<div class="img-box"><a href="/uploads/' + x.screenshot + '" target="_blank">📷 عرض الصورة</a><br><img src="/uploads/' + x.screenshot + '" onclick="window.open(this.src)"></div>' : '';
        var money = (x.status === 'pending') ? '<div class="money"><label>💰 المبلغ:</label><input type="number" id="amt_' + x.id + '" placeholder="اكتب المبلغ" value="' + (x.amount || '') + '"></div>' : (x.amount ? '<div class="money"><label>💰 المبلغ:</label><b style="color:#fff;font-size:16px">' + x.amount + ' جنيه</b></div>' : '');
        var actions = (x.status === 'pending') ? '<div class="actions"><button class="btn btn-ok" onclick="handleReq(' + x.id + ',\'approve\')">✅ موافقة</button><button class="btn btn-no" onclick="handleReq(' + x.id + ',\'reject\')">❌ رفض</button></div>' : '';
        var stTxt = x.status === 'pending' ? '⏳ معلق' : (x.status === 'approved' ? '✅ تم' : '❌ مرفوض');
        return '<div class="card"><div class="row"><div style="flex:1">' +
            '<div class="label">الرقم المشفر:</div><div class="phone">' + x.card_number + '</div>' +
            '<div class="name">' + (x.name || 'جديد') + '</div>' +
            '<div style="margin-top:8px"><span class="label">المدة:</span> <b>' + x.months + ' شهر</b></div>' +
            '<div><span class="label">حوّل من:</span> <b style="direction:ltr">' + (x.from_phone || '-') + '</b></div>' +
            '<div class="label" style="margin-top:6px">' + x.created_at + '</div>' +
            '</div><span class="badge ' + x.status + '">' + stTxt + '</span></div>' + img + money + actions + '</div>';
    }).join('');
}

async function handleReq(id, action) {
    var amt = '';
    if (action === 'approve') {
        var inp = document.getElementById('amt_' + id);
        amt = inp ? inp.value.trim() : '';
        if (!amt) return alert('اكتب المبلغ');
    }
    if (!confirm('متأكد؟')) return;
    await fetch('/api/admin/handle', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:id, action:action, amount:amt})});
    loadRequests();
}

async function loadUsers() {
    var r = await fetch('/api/admin/users');
    var d = await r.json();
    var b = document.getElementById('usersView');
    var form = '<div class="add-form"><h3>➕ إضافة مشترك</h3>' +
        '<input id="nu_card" placeholder="الرقم المشفر">' +
        '<input id="nu_name" placeholder="الاسم">' +
        '<input id="nu_phone" placeholder="رقم الموبايل">' +
        '<input type="date" id="nu_expiry">' +
        '<button class="btn btn-gold" onclick="addUser()" style="width:100%">إضافة</button></div>';
    var list = d.length ? d.map(function(u) {
        var st = u.status === 'active' ? '✅ شغال' : '❌ منتهي';
        var stc = u.status === 'active' ? 'active-b' : 'expired-b';
        return '<div class="card"><div class="row"><div style="flex:1">' +
            '<div class="phone">' + u.card_number + '</div>' +
            '<div class="name">' + (u.name || '-') + '</div>' +
            '<div><span class="label">موبايل:</span> <b style="direction:ltr">' + (u.phone || '-') + '</b></div>' +
            '<div><span class="label">ينتهي:</span> <b>' + u.expiry + '</b></div>' +
            '<div><span class="label">فاضل:</span> <b>' + (u.days_left > 0 ? u.days_left + ' يوم' : 'خلص') + '</b></div>' +
            '</div><span class="badge ' + stc + '">' + st + '</span></div>' +
            '<div class="actions"><button class="btn btn-blue btn-sm" onclick="editUser(\'' + u.card_number + '\')">✏️ تعديل</button>' +
            '<button class="btn btn-no btn-sm" onclick="delUser(\'' + u.card_number + '\')">🗑️ حذف</button></div></div>';
    }).join('') : '<div class="empty">مفيش مشتركين</div>';
    b.innerHTML = form + list;
}

async function addUser() {
    var d = {
        card_number: document.getElementById('nu_card').value.trim(),
        name: document.getElementById('nu_name').value.trim(),
        phone: document.getElementById('nu_phone').value.trim(),
        expiry: document.getElementById('nu_expiry').value
    };
    if (!d.card_number) return alert('اكتب الرقم');
    var r = await fetch('/api/admin/add_user', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(d)});
    var res = await r.json();
    if (!res.ok) return alert(res.msg || 'خطأ');
    alert('تم');
    loadUsers();
}

async function editUser(card) {
    var n = prompt('الاسم الجديد:');
    var p = prompt('الموبايل الجديد:');
    var e = prompt('تاريخ الانتهاء (YYYY-MM-DD):');
    var d = {card_number: card};
    if (n) d.name = n;
    if (p) d.phone = p;
    if (e) d.expiry = e;
    await fetch('/api/admin/edit_user', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(d)});
    loadUsers();
}

async function delUser(card) {
    if (!confirm('حذف؟')) return;
    await fetch('/api/admin/del_user/' + card, {method:'DELETE'});
    loadUsers();
}

async function loadChannels() {
    var r = await fetch('/api/admin/channels');
    var d = await r.json();
    var b = document.getElementById('channelsView');
    var bulk = '<div class="bulk"><h3>⚡ إضافة 50 قناة</h3><button class="btn btn-gold" onclick="addBulk()">إضافة Star Sport 1 → 50</button></div>';
    if (!d.length) { b.innerHTML = bulk + '<div class="empty">مفيش قنوات</div>'; return; }
    var grid = '<div class="ch-grid">' + d.map(function(c) {
        var isClosed = !!c.problem;
        return '<div class="ch-card ' + (isClosed ? 'closed' : 'open') + '">' +
            '<div style="font-size:24px">📺</div>' +
            '<div class="name">' + c.name + '</div>' +
            '<div class="status ' + (isClosed ? 'closed-b' : 'open-b') + '">' + (isClosed ? '❌ مقفلة' : '✅ شغالة') + '</div>' +
            '<div class="btns">' +
            (isClosed ? '<button class="btn btn-ok btn-sm" onclick="openCh(' + c.id + ')">✅ فتح</button>'
                       : '<button class="btn btn-no btn-sm" onclick="closeCh(' + c.id + ')">❌ قفل</button>') +
            '<button class="btn btn-no btn-sm" onclick="delCh(' + c.id + ')">🗑️</button>' +
            '</div></div>';
    }).join('') + '</div>';
    b.innerHTML = bulk + grid;
}

async function addBulk() {
    if (!confirm('إضافة 50 قناة؟')) return;
    var r = await fetch('/api/admin/add_bulk_channels', {method:'POST'});
    var d = await r.json();
    if (d.ok) alert('تمت إضافة ' + d.added);
    loadChannels();
}

async function closeCh(id) {
    var msg = prompt('المشكلة اللي تظهر للعميل:', 'القناة مقفلة حالياً');
    if (msg === null) return;
    if (!msg) msg = 'القناة مقفلة حالياً';
    await fetch('/api/admin/edit_channel', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:id, problem:msg})});
    loadChannels();
}

async function openCh(id) {
    if (!confirm('فتح القناة؟')) return;
    await fetch('/api/admin/edit_channel', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:id, problem:''})});
    loadChannels();
}

async function delCh(id) {
    if (!confirm('حذف؟')) return;
    await fetch('/api/admin/del_channel/' + id, {method:'DELETE'});
    loadChannels();
}

async function loadIssues() {
    var r = await fetch('/api/admin/issues');
    var d = await r.json();
    var b = document.getElementById('issuesView');
    if (!d.length) { b.innerHTML = '<div class="empty">مفيش مشاكل</div>'; return; }
    b.innerHTML = d.map(function(x) {
        return '<div class="issue-card">' +
            '<div class="ch">📺 ' + x.channel_name + '</div>' +
            '<div><b>' + (x.customer_name || '-') + '</b> — <span style="direction:ltr">' + (x.card_number || '-') + '</span></div>' +
            (x.phone ? '<div><span class="label">موبايل:</span> <b style="direction:ltr">' + x.phone + '</b></div>' : '') +
            '<div class="msg">' + x.message + '</div>' +
            '<div class="label">' + x.created_at + '</div>' +
            '<div class="actions"><button class="btn btn-no btn-sm" onclick="delIssue(' + x.id + ')">🗑️ حذف</button></div>' +
            '</div>';
    }).join('');
}

async function delIssue(id) {
    if (!confirm('حذف؟')) return;
    await fetch('/api/admin/del_issue/' + id, {method:'DELETE'});
    loadIssues();
}

async function loadStats() {
    var r = await fetch('/api/admin/stats');
    var d = await r.json();
    document.getElementById('statsView').innerHTML = '<div class="stat-box">' +
        '<div class="stat"><div class="num">' + (d.users || 0) + '</div><div class="lbl">مشتركين</div></div>' +
        '<div class="stat"><div class="num">' + (d.active || 0) + '</div><div class="lbl">نشطين</div></div>' +
        '<div class="stat"><div class="num">' + (d.pending || 0) + '</div><div class="lbl">طلبات</div></div>' +
        '<div class="stat"><div class="num">' + (d.total_money || d.money || 0) + '</div><div class="lbl">إجمالي المبالغ</div></div>' +
        '<div class="stat"><div class="num">' + (d.channels || 0) + '</div><div class="lbl">قنوات</div></div>' +
        '<div class="stat"><div class="num">' + (d.issues || 0) + '</div><div class="lbl">مشاكل</div></div>' +
        '</div>';
}

function tab(t, el) {
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
    el.classList.add('active');
    ['requests','users','channels','issues','stats'].forEach(function(v){
        document.getElementById(v+'View').classList.add('hidden');
    });
    document.getElementById(t+'View').classList.remove('hidden');
    if (t === 'requests') loadRequests();
    if (t === 'users') loadUsers();
    if (t === 'channels') loadChannels();
    if (t === 'issues') loadIssues();
    if (t === 'stats') loadStats();
}

loadRequests();
</script>
</body>
</html>
