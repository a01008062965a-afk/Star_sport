<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجديد الاشتراك</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
.card{background:#fff;color:#222;border-radius:16px;padding:22px;max-width:440px;margin:16px auto;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
h2{font-size:18px;margin-bottom:14px;color:#0f2027}
label{display:block;font-size:14px;margin:10px 0 4px;color:#444}
input,select{width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:10px;margin-bottom:8px}
input:focus,select:focus{border-color:#2c5364;outline:none}
button{width:100%;padding:14px;font-size:17px;background:linear-gradient(90deg,#f7971e,#ffd200);color:#222;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:8px}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:12px;font-size:14px}
.support{display:block;text-align:center;color:#e53935;text-decoration:none;margin-top:10px;font-size:13px}
.info-row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee;font-size:15px}
.phone-box{background:#f0f4ff;padding:14px;border-radius:10px;text-align:center;direction:ltr;font-size:20px;font-weight:bold;color:#2c5364;letter-spacing:1px;margin:10px 0;cursor:pointer}
.phone-box:active{background:#d6e0ff}
.status{padding:10px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:12px}
.active{background:#e8f5e9;color:#2e7d32}
.expired{background:#ffebee;color:#c62828}
.hidden{display:none}
.success{background:#e8f5e9;color:#2e7d32;padding:14px;border-radius:10px;text-align:center;font-weight:bold}
.note{background:#fff8e1;border-right:4px solid #ffb300;padding:12px;border-radius:8px;font-size:13px;line-height:1.7;margin:10px 0}
.file-input{padding:10px;border:2px dashed #ccc;border-radius:10px;text-align:center;cursor:pointer;font-size:14px;background:#fafafa}
.copied{background:#c8e6c9 !important;color:#2e7d32 !important}
</style>
</head>
<body>

<!-- شاشة 1: الرقم المشفر -->
<div class="card" id="s1">
<h2>💳 تجديد الاشتراك</h2>
<label>🔒 الرقم الظاهر في القناة المشفرة</label>
<input type="text" id="card1" placeholder="مثال: 1001" inputmode="numeric">
<button onclick="checkCard()">دخول</button>
<a href="/support" class="support">📞 نسيته؟ تواصل مع الدعم</a>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<!-- شاشة 2: بيانات الاشتراك + اختيار المدة -->
<div class="card hidden" id="s2">
<h2>بيانات اشتراكك</h2>
<div id="st"></div>
<div class="info-row"><span>الاسم:</span><b id="n">-</b></div>
<div class="info-row"><span>ينتهي:</span><b id="e">-</b></div>
<div class="info-row"><span>فاضل:</span><b id="d">-</b></div>

<label>اختر مدة التجديد</label>
<select id="months">
<option value="1">شهر واحد</option>
<option value="2">شهرين</option>
<option value="3">3 شهور</option>
</select>
<button onclick="showPay()">التالي ←</button>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<!-- شاشة 3: التحويل + السكرين -->
<div class="card hidden" id="s3">
<h2>خطوات الدفع</h2>

<div class="note">
<b>1) حوّل على الرقم:</b>
<div class="phone-box" id="vodafone" onclick="copyNum(this)">01006654853</div>
<div style="text-align:center;font-size:12px;color:#666">فودافون كاش أو إنستاباي — اضغط للنسخ 📋</div>
</div>

<label>2) اكتب الرقم اللي حوّلت منه</label>
<input type="tel" id="fromPhone" placeholder="01xxxxxxxxx" maxlength="11">

<label>3) ارفع صورة التحويل (سكرين شوت)</label>
<input type="file" id="screenshot" accept="image/*" capture="environment">

<button onclick="sendReq()">📤 إرسال طلب التجديد</button>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<!-- شاشة 4: النجاح -->
<div class="card hidden" id="s4">
<div class="success">
✅ تم إرسال طلبك بنجاح<br>
<span style="font-size:13px;font-weight:normal">هيتم التواصل معاك بعد المراجعة</span>
</div>
<a href="/" class="back" style="margin-top:14px">← رجوع للرئيسية</a>
</div>

<script>
let curCard = null;
let curUser = null;

async function checkCard() {
    const c = document.getElementById('card1').value.trim();
    if (!c) return alert('ادخل الرقم المشفر');
    try {
        const r = await fetch('/api/check-card', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({card_number: c})
        });
        const d = await r.json();
        if (!d.ok) return alert(d.msg);
        curCard = c;
        curUser = d.user;
        document.getElementById('n').textContent = d.user.name || '-';
        document.getElementById('e').textContent = d.user.expiry;
        document.getElementById('d').textContent = d.user.days_left > 0 ? d.user.days_left + ' يوم' : 'خلص';
        const st = document.getElementById('st');
        st.className = 'status ' + (d.user.status === 'active' ? 'active' : 'expired');
        st.textContent = d.user.status === 'active' ? '✅ اشتراكك شغال' : '❌ الاشتراك خلص';
        document.getElementById('s1').classList.add('hidden');
        document.getElementById('s2').classList.remove('hidden');
    } catch(e) { alert('خطأ في الاتصال'); }
}

function showPay() {
    document.getElementById('s2').classList.add('hidden');
    document.getElementById('s3').classList.remove('hidden');
}

function copyNum(el) {
    navigator.clipboard.writeText(el.textContent.trim());
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 1000);
}

async function sendReq() {
    const months = document.getElementById('months').value;
    const fromPhone = document.getElementById('fromPhone').value.trim();
    const fileInput = document.getElementById('screenshot');

    if (!fromPhone) return alert('اكتب الرقم اللي حوّلت منه');
    if (!fileInput.files[0]) return alert('ارفع صورة التحويل');

    const fd = new FormData();
    fd.append('card_number', curCard);
    fd.append('months', months);
    fd.append('from_phone', fromPhone);
    fd.append('screenshot', fileInput.files[0]);

    try {
        const r = await fetch('/api/renew', { method: 'POST', body: fd });
        const d = await r.json();
        if (!d.ok) return alert(d.msg);
        document.getElementById('s3').classList.add('hidden');
        document.getElementById('s4').classList.remove('hidden');
    } catch(e) { alert('خطأ في الاتصال'); }
}
</script>
</body>
</html>
