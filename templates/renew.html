<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجديد الاشتراك</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
.card{background:#fff;color:#222;border-radius:16px;padding:22px;max-width:440px;margin:16px auto;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
h2{font-size:18px;margin-bottom:14px;color:#0f2027}
label{display:block;font-size:14px;margin:10px 0 4px;color:#444}
input[type=text],input[type=tel],select{width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:10px;margin-bottom:8px}
input:focus,select:focus{border-color:#2c5364;outline:none}
button{width:100%;padding:14px;font-size:16px;background:linear-gradient(90deg,#f7971e,#ffd200);color:#222;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:8px}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:12px;font-size:14px}
.support{display:block;text-align:center;color:#e53935;text-decoration:none;margin-top:10px;font-size:13px}
.phone-box{background:#f0f4ff;padding:14px;border-radius:10px;text-align:center;direction:ltr;font-size:20px;font-weight:bold;color:#2c5364;letter-spacing:1px;margin:10px 0;cursor:pointer}
.phone-box:active{background:#d6e0ff}
.info-row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee;font-size:15px}
.status{padding:12px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:12px;font-size:15px}
.active{background:#e8f5e9;color:#2e7d32}
.expired{background:#ffebee;color:#c62828}
.pending{background:#fff8e1;color:#ef6c00}
.rejected{background:#ffebee;color:#c62828}
.hidden{display:none}
.success{background:#e8f5e9;color:#2e7d32;padding:14px;border-radius:10px;text-align:center;font-weight:bold;line-height:1.7}
.note{background:#fff8e1;border-right:4px solid #ffb300;padding:12px;border-radius:8px;font-size:13px;line-height:1.7;margin:10px 0}
.btn-row{display:flex;gap:8px;margin:8px 0}
.btn-row button{flex:1;padding:12px;font-size:14px;background:#2c5364;color:#fff;border-radius:10px;border:none;cursor:pointer;font-weight:bold}
.file-info{font-size:12px;color:#2e7d32;text-align:center;margin-top:6px;display:none}
.copied{background:#c8e6c9 !important;color:#2e7d32 !important}
.new-user{background:#e3f2fd;color:#1565c0;padding:12px;border-radius:10px;text-align:center;font-size:13px;margin-bottom:12px;line-height:1.7}
.welcome{text-align:center;font-size:15px;color:#ffd200;background:#0f2027;padding:10px;border-radius:10px;margin-bottom:12px;font-weight:bold}
</style>
</head>
<body>

<!-- شاشة 1 -->
<div class="card" id="s1">
<h2>💳 تجديد الاشتراك</h2>
<label>🔒 الرقم الظاهر في القناة المشفرة</label>
<input type="text" id="card1" placeholder="اكتب الرقم كامل" autocomplete="off">
<button onclick="nextStep()">التالي ←</button>
<a href="/support" class="support">📞 نسيته؟ تواصل مع الدعم</a>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<!-- شاشة 2 -->
<div class="card hidden" id="s2">
<div class="welcome" id="welcome">👋 أهلاً بيك</div>
<div id="userInfo"></div>
<div id="blockMsg" class="hidden"></div>
<div id="renewForm">
<label>اختر مدة التجديد</label>
<select id="months">
<option value="1">شهر واحد</option>
<option value="2">شهرين</option>
<option value="3">3 شهور</option>
</select>
<button onclick="showPay()">التالي ←</button>
</div>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<!-- شاشة 3 -->
<div class="card hidden" id="s3">
<h2>خطوات الدفع</h2>
<div class="note">
<b>1) حوّل على الرقم:</b>
<div class="phone-box" onclick="copyNum(this)">01006654853</div>
<div style="text-align:center;font-size:12px;color:#666">فودافون كاش أو إنستاباي — اضغط للنسخ 📋</div>
</div>
<label>2) الرقم اللي حوّلت منه</label>
<input type="tel" id="fromPhone" placeholder="01xxxxxxxxx" maxlength="15">

<label>3) صورة التحويل</label>
<div class="btn-row">
<button onclick="document.getElementById('cam').click()">📷 الكاميرا</button>
<button onclick="document.getElementById('gal').click()">🖼️ المعرض</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="picked(this)">
<input type="file" id="gal" accept="image/*" style="display:none" onchange="picked(this)">
<div class="file-info" id="fname">✅ تم اختيار الصورة</div>

<button onclick="sendReq()">📤 إرسال طلب التجديد</button>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<!-- شاشة 4 -->
<div class="card hidden" id="s4">
<div class="success">
✅ تم إرسال طلبك بنجاح<br>
<span style="font-size:13px;font-weight:normal">هيتم التواصل معاك بعد المراجعة</span>
</div>
<a href="/" class="back" style="margin-top:14px">← رجوع للرئيسية</a>
</div>

<script>
var curCard = null, curFile = null;

async function nextStep() {
    var c = document.getElementById('card1').value.trim();
    if (!c) return alert('ادخل الرقم المشفر');
    curCard = c;
    localStorage.setItem('last_card', c);

    try {
        var r = await fetch('/api/check-card', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({card_number: c})
        });
        var d = await r.json();
        var box = document.getElementById('userInfo');
        var welcome = document.getElementById('welcome');
        var block = document.getElementById('blockMsg');
        var form = document.getElementById('renewForm');

        // reset
        block.classList.add('hidden');
        form.classList.remove('hidden');

        if (d.ok) {
            var u = d.user;
            welcome.innerHTML = '👋 أهلاً بيك يا ' + (u.name || 'صديقنا');
            box.innerHTML =
                '<div class="status ' + (u.status === 'active' ? 'active' : 'expired') + '">' +
                    (u.status === 'active' ? '✅ اشتراكك شغال' : '❌ الاشتراك خلص') +
                '</div>' +
                '<div class="info-row"><span>ينتهي:</span><b>' + u.expiry + '</b></div>' +
                '<div class="info-row"><span>فاضل:</span><b>' + (u.days_left > 0 ? u.days_left + ' يوم' : 'خلص') + '</b></div>';

            // لو فيه طلب معلق
            if (u.last_request_status === 'pending') {
                block.classList.remove('hidden');
                block.innerHTML = '<div class="status pending">⏳ فيه طلب معلق بالفعل<br><span style="font-size:12px;font-weight:normal">استنى الموافقة أو الرفض</span></div>';
                form.classList.add('hidden');
            }
        } else {
            welcome.innerHTML = '👋 أهلاً بيك';
            box.innerHTML = '<div class="new-user">📝 <b>مشترك جديد</b><br>الرقم ده مش مسجل — بعد ما تحوّل، انتظر الموافقة وهيتم تسجيلك تلقائياً</div>';
        }

        document.getElementById('s1').classList.add('hidden');
        document.getElementById('s2').classList.remove('hidden');
    } catch(e) { alert('خطأ في الاتصال'); }
}

function showPay() {
    document.getElementById('s2').classList.add('hidden');
    document.getElementById('s3').classList.remove('hidden');
}

function copyNum(el) {
    navigator.clipboard.writeText(el.textContent.trim());
    el.classList.add('copied');
    setTimeout(function(){ el.classList.remove('copied'); }, 1000);
}

function picked(inp) {
    if (inp.files && inp.files[0]) {
        curFile = inp.files[0];
        document.getElementById('fname').style.display = 'block';
    }
}

async function sendReq() {
    var months = document.getElementById('months').value;
    var fromPhone = document.getElementById('fromPhone').value.trim();
    if (!fromPhone) return alert('اكتب الرقم اللي حوّلت منه');
    if (!curFile) return alert('ارفع صورة التحويل');

    var fd = new FormData();
    fd.append('card_number', curCard);
    fd.append('months', months);
    fd.append('from_phone', fromPhone);
    fd.append('screenshot', curFile);

    try {
        var r = await fetch('/api/renew', { method: 'POST', body: fd });
        var d = await r.json();
        if (!d.ok) return alert(d.msg);
        document.getElementById('s3').classList.add('hidden');
        document.getElementById('s4').classList.remove('hidden');
    } catch(e) { alert('خطأ في الاتصال'); }
}
</script>
</body>
</html>
