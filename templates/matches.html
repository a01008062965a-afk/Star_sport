<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مباريات اليوم</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
h1{text-align:center;margin-bottom:20px;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#fff;color:#222;border-radius:14px;padding:16px;margin-bottom:12px;max-width:500px;margin-left:auto;margin-right:auto}
.league{font-size:12px;color:#888;margin-bottom:8px}
.teams{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:bold;color:#0f2027;margin:8px 0}
.vs{color:#ffd200;background:#0f2027;padding:4px 10px;border-radius:20px;font-size:13px}
.meta{display:flex;justify-content:space-between;font-size:14px;color:#666;margin-top:10px;padding-top:10px;border-top:1px solid #eee}
.empty{text-align:center;color:#aaa;padding:40px;background:#fff;border-radius:14px;max-width:500px;margin:0 auto}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:18px}
</style>
</head>
<body>
<h1>⚽ مباريات اليوم</h1>
{% if matches %}
{% for m in matches %}
<div class="card">
<div class="league">🏆 {{ m.league }}</div>
<div class="teams">
<span>{{ m.home }}</span>
<span class="vs">VS</span>
<span>{{ m.away }}</span>
</div>
<div class="meta">
<span>🕐 {{ m.time }}</span>
<span>📺 {{ m.channel }}</span>
</div>
</div>
{% endfor %}
{% else %}
<div class="empty">مفيش مباريات النهارده</div>
{% endif %}
<a href="/" class="back">← رجوع للرئيسية</a>
</body>
</html>
