<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار اليوم</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
h1{text-align:center;margin-bottom:20px;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cat{background:rgba(255,215,0,0.15);padding:8px 14px;border-radius:20px;display:inline-block;font-size:13px;color:#ffd200;margin-bottom:8px}
.card{background:#fff;color:#222;border-radius:14px;padding:16px;margin-bottom:12px}
.zikr{font-size:15px;line-height:1.9;color:#0f2027}
.counter{display:inline-block;background:#f0f4ff;color:#2c5364;font-size:12px;padding:4px 10px;border-radius:12px;margin-top:10px;font-weight:bold}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:18px}
.count{text-align:center;color:#aaa;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
<h1>📿 أذكار اليوم</h1>
<div class="count" id="count">جاري التحميل...</div>
<div id="list"></div>
<a href="/" class="back">← رجوع للرئيسية</a>
<script>
fetch('/api/azkar').then(r=>r.json()).then(d=>{
document.getElementById('count').textContent='📖 '+d.length+' ذكر';
document.getElementById('list').innerHTML=d.map(z=>`
<div class="card">
<div class="cat">${z.category}</div>
<div class="zikr">${z.text}</div>
</div>`).join('');
});
</script>
</body>
</html>
