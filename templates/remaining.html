<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتبقي في الاشتراك</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
.card{background:#fff;color:#222;border-radius:16px;padding:22px;max-width:440px;margin:16px auto;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
h2{font-size:18px;margin-bottom:14px;color:#0f2027}
label{display:block;font-size:14px;margin:10px 0 4px;color:#444}
input{width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:10px;margin-bottom:8px}
input:focus{border-color:#2c5364;outline:none}
button{width:100%;padding:14px;font-size:17px;background:linear-gradient(90deg,#f7971e,#ffd200);color:#222;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:8px}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:12px;font-size:14px}
.support{display:block;text-align:center;color:#e53935;text-decoration:none;margin-top:10px;font-size:13px}
.big-days{font-size:52px;font-weight:bold;color:#2c5364;text-align:center;margin:16px 0}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee;font-size:15px}
.hidden{display:none}
.error{background:#ffebee;color:#c62828;padding:14px;border-radius:10px;text-align:center;font-weight:bold;font-size:15px}
.active-msg{background:#e8f5e9;color:#2e7d32;padding:12px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:12px}
.expired-msg{background:#ffebee;color:#c62828;padding:12px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:12px}
</style>
</head>
<body>

<div class="card" id="s1">
<h2>⏳ المتبقي في الاشتراك</h2>
<label>🔒 الرقم الظاهر في القناة المشفرة</label>
<input type="text" id="card1" placeholder="اكتب الرقم كامل" autocomplete="off">
<button onclick="checkCard()">عرض المتبقي</button>
<a href="/support" class="support">📞 نسيته؟ تواصل مع الدعم</a>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<div class="card hidden" id="s2">
<div id="msg"></div>
<div class="big-days" id="big">-</div>
<div class="row"><span>الاسم:</span><b id="n">-</b></div>
<div class="row"><span>الرقم:</span><b id="c">-</b></div>
<div class="row"><span>ينتهي:</span><b id="e">-</b></div>
<a href="/" class="back" style="margin-top:16px">← رجوع للرئيسية</a>
</div>

<div class="card hidden" id="s3">
<div class="error">❌ أنت لست مشترك<br><span style="font-size:13px;font-weight:normal">كلم الدعم للاشتراك</span></div>
<a href="/support" class="support">📞 تواصل مع الدعم</a>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<script>
async function checkCard() {
    const c = document.getElementById('card1').value.trim();
    if (!c) return alert('ادخل الرقم المشفر');
    try {
        const r = await fetch('/api/check-card', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({card_number: c})
        });
        const d = await r.json();
        if (!d.ok) {
            document.getElementById('s1').classList.add('hidden');
            document.getElementById('s3').classList.remove('hidden');
            return;
        }
        const u = d.user;
        document.getElementById('n').textContent = u.name || '-';
        document.getElementById('c').textContent = u.card_number || '-';
        document.getElementById('e').textContent = u.expiry;
        const msg = document.getElementById('msg');
        const big = document.getElementById('big');
        if (u.days_left > 0) {
            msg.className = 'active-msg';
            msg.textContent = '✅ اشتراكك شغال';
            big.textContent = u.days_left + ' يوم';
            big.style.color = '#2e7d32';
        } else {
            msg.className = 'expired-msg';
            msg.textContent = '❌ الاشتراك خلص';
            big.textContent = 'منتهي';
            big.style.color = '#c62828';
        }
        document.getElementById('s1').classList.add('hidden');
        document.getElementById('s2').classList.remove('hidden');
    } catch(e) { alert('خطأ في الاتصال'); }
}
</script>
</body>
</html>
