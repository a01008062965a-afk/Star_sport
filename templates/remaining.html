<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتبقي في الاشتراك</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
.card{background:#fff;color:#222;border-radius:16px;padding:22px;max-width:440px;margin:16px auto;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
h2{font-size:18px;margin-bottom:14px;color:#0f2027}
input{width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:10px;margin-bottom:8px}
button{width:100%;padding:14px;font-size:17px;background:linear-gradient(90deg,#f7971e,#ffd200);color:#222;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:8px}
.big-days{font-size:48px;font-weight:bold;color:#2c5364;text-align:center;margin:16px 0}
.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:12px;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card" id="s1">
<h2>⏳ المتبقي في الاشتراك</h2>
<label style="display:block;margin:10px 0 4px;color:#444;font-size:14px">رقم الموبايل</label>
<input type="tel" id="phone" placeholder="01xxxxxxxxx" maxlength="11">
<button onclick="check()">عرض المتبقي</button>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<div class="card hidden" id="s2">
<h2>النتيجة</h2>
<div class="big-days" id="big">-</div>
<div class="row"><span>الاسم:</span><b id="n">-</b></div>
<div class="row"><span>الرقم:</span><b id="p">-</b></div>
<div class="row"><span>ينتهي:</span><b id="e">-</b></div>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<script>
async function check(){
const p=document.getElementById('phone').value.trim();
if(!p)return alert('ادخل الرقم');
try{const r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p})});
const d=await r.json();
if(!d.ok)return alert(d.msg);
const u=d.user;
document.getElementById('big').textContent=u.days_left>0?u.days_left+' يوم':'خلص';
document.getElementById('n').textContent=u.name||'-';
document.getElementById('p').textContent=u.phone;
document.getElementById('e').textContent=u.expiry;
document.getElementById('s1').classList.add('hidden');
document.getElementById('s2').classList.remove('hidden');
}catch(e){alert('خطأ')}
}
</script>
</body>
</html>
