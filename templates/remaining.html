<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتبقي في الاشتراك</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
.card{background:#fff;color:#222;border-radius:16px;padding:22px;max-width:440px;margin:16px auto;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
h2{font-size:18px;margin-bottom:14px;color:#0f2027}
label{display:block;font-size:14px;margin:10px 0 4px;color:#444}
input{width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:10px;margin-bottom:8px}
input:focus{border-color:#2c5364;outline:none}
button{width:100%;padding:14px;font-size:16px;background:linear-gradient(90deg,#f7971e,#ffd200);color:#222;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:8px}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:12px;font-size:14px}
.support{display:block;text-align:center;color:#e53935;text-decoration:none;margin-top:10px;font-size:13px}
.big-days{font-size:52px;font-weight:bold;text-align:center;margin:16px 0}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee;font-size:15px}
.row:last-child{border-bottom:none}
.hidden{display:none}
.msg{padding:14px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:12px;font-size:15px;line-height:1.7}
.active-msg{background:#e8f5e9;color:#2e7d32}
.expired-msg{background:#ffebee;color:#c62828}
.pending-msg{background:#fff8e1;color:#ef6c00}
.rejected-msg{background:#ffebee;color:#c62828}
.new-msg{background:#e3f2fd;color:#1565c0}
.welcome{text-align:center;font-size:15px;color:#ffd200;background:#0f2027;padding:10px;border-radius:10px;margin-bottom:12px;font-weight:bold}
.action-link{display:block;text-align:center;padding:12px;background:#2c5364;color:#fff;border-radius:10px;text-decoration:none;margin-top:12px;font-weight:bold}
</style>
</head>
<body>

<div class="card" id="s1">
<h2>⏳ المتبقي في الاشتراك</h2>
<label>🔒 الرقم الظاهر في القناة المشفرة</label>
<input type="text" id="card1" placeholder="اكتب الرقم كامل" autocomplete="off">
<button onclick="checkCard()">عرض المتبقي</button>
<a href="/support" class="support">📞 نسيته؟ تواصل مع الدعم</a>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<div class="card hidden" id="s2">
<div class="welcome" id="welcome">👋 أهلاً بيك</div>
<div id="mainMsg"></div>
<div id="bigDays" class="big-days" style="display:none">-</div>
<div id="details"></div>
<a href="/renew" class="action-link" id="renewBtn" style="display:none">💳 جدد اشتراكك الآن</a>
<a href="/" class="back" style="margin-top:14px">← رجوع للرئيسية</a>
</div>

<script>
async function checkCard() {
    var c = document.getElementById('card1').value.trim();
    if (!c) return alert('ادخل الرقم المشفر');

    try {
        var r = await fetch('/api/check-card', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({card_number: c})
        });
        var d = await r.json();

        var welcome = document.getElementById('welcome');
        var msg = document.getElementById('mainMsg');
        var big = document.getElementById('bigDays');
        var det = document.getElementById('details');
        var renewBtn = document.getElementById('renewBtn');

        if (!d.ok) {
            welcome.innerHTML = '👋 أهلاً بيك';
            msg.innerHTML = '<div class="msg new-msg">❌ أنت لست مشترك<br><span style="font-size:13px;font-weight:normal">كلم الدعم للاشتراك</span></div>';
            det.innerHTML = '';
            big.style.display = 'none';
            renewBtn.style.display = 'block';
        } else {
            var u = d.user;
            welcome.innerHTML = '👋 أهلاً بيك يا ' + (u.name || 'صديقنا');

            var lastStatus = u.last_request_status;
            var lastAmount = u.last_request_amount || 0;

            // لو فيه طلب معلق
            if (lastStatus === 'pending') {
                msg.innerHTML = '<div class="msg pending-msg">⏳ فيه طلب تجديد تحت المراجعة<br><span style="font-size:13px;font-weight:normal">هيتم الرد عليك قريباً</span></div>';
            }
            // لو اتوافق عليه
            else if (lastStatus === 'approved') {
                msg.innerHTML = '<div class="msg active-msg">✅ تم تجديد اشتراكك' +
                    (lastAmount > 0 ? '<br><span style="font-size:13px;font-weight:normal">المبلغ: ' + lastAmount + ' جنيه</span>' : '') +
                    '</div>';
            }
            // لو اترفض
            else if (lastStatus === 'rejected') {
                msg.innerHTML = '<div class="msg rejected-msg">❌ تم رفض طلب التجديد<br><span style="font-size:13px;font-weight:normal">كلم الدعم للاستفسار</span></div>';
            }
            // لو مشترك عادي
            else {
                if (u.days_left > 0) {
                    msg.innerHTML = '<div class="msg active-msg">✅ اشتراكك شغال</div>';
                } else {
                    msg.innerHTML = '<div class="msg expired-msg">❌ الاشتراك خلص</div>';
                }
            }

            // الأيام
            if (u.days_left > 0) {
                big.style.display = 'block';
                big.textContent = u.days_left + ' يوم';
                big.style.color = '#2e7d32';
            } else {
                big.style.display = 'none';
            }

            det.innerHTML =
                '<div class="row"><span>الرقم المشفر:</span><b style="direction:ltr">' + u.card_number + '</b></div>' +
                '<div class="row"><span>ينتهي:</span><b>' + u.expiry + '</b></div>' +
                (u.last_amount > 0 ? '<div class="row"><span>آخر مبلغ:</span><b>' + u.last_amount + ' جنيه</b></div>' : '');

            renewBtn.style.display = 'block';
            if (lastStatus === 'pending') renewBtn.style.display = 'none';
        }

        document.getElementById('s1').classList.add('hidden');
        document.getElementById('s2').classList.remove('hidden');
    } catch(e) { alert('خطأ في الاتصال'); }
}
</script>
</body>
</html>
