<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آية قرآنية</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
h1{text-align:center;margin-bottom:20px;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#fff;color:#222;border-radius:18px;padding:30px 20px;max-width:500px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.surah{color:#2c5364;font-weight:bold;margin-bottom:12px;text-align:center;font-size:15px;background:#f0f4ff;padding:8px;border-radius:10px}
.aya{font-size:20px;line-height:2;color:#0f2027;text-align:center;font-weight:bold;padding:20px 0;border-top:2px solid #ffd200;border-bottom:2px solid #ffd200;margin:16px 0}
.actions{display:flex;gap:8px;margin-top:16px}
button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
.new{background:linear-gradient(90deg,#f7971e,#ffd200);color:#222}
.copy{background:#2c5364;color:#fff}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:18px}
</style>
</head>
<body>
<h1>📖 آية قرآنية</h1>
<div class="card">
<div class="surah" id="s">جاري التحميل...</div>
<div class="aya" id="t">...</div>
<div class="actions">
<button class="new" onclick="load()">🔄 آية أخرى</button>
<button class="copy" onclick="cp()">📋 نسخ</button>
</div>
</div>
<a href="/" class="back">← رجوع للرئيسية</a>

<script>
var cur = '';
function load() {
  fetch('/api/quran')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      document.getElementById('s').textContent = 'سورة ' + d.surah + ' — الآية ' + d.ayah;
      document.getElementById('t').textContent = d.text;
      cur = d.text + ' (سورة ' + d.surah + ')';
    })
    .catch(function(e) {
      document.getElementById('s').textContent = 'خطأ';
    });
}
function cp() {
  if (cur) {
    navigator.clipboard.writeText(cur);
    alert('تم النسخ');
  }
}
load();
</script>
</body>
</html>
