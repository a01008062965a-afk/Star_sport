<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة - أسيوط</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
h1{text-align:center;margin-bottom:8px;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.city{text-align:center;color:#ffd200;margin-bottom:20px;font-size:16px}
.card{background:#fff;color:#222;border-radius:14px;padding:8px;max-width:440px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.row{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid #eee;font-size:17px}
.row:last-child{border-bottom:none}
.row .name{color:#0f2027;font-weight:bold}
.row .time{color:#2c5364;font-weight:bold;direction:ltr;font-size:18px}
.highlight{background:linear-gradient(90deg,#fff8e1,#ffd200 200%);border-radius:10px;margin:4px}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:18px}
</style>
</head>
<body>
<h1>🕋 مواقيت الصلاة</h1>
<div class="city" id="city">📍 جاري التحميل...</div>
<div class="card" id="list"></div>
<a href="/" class="back">← رجوع للرئيسية</a>
<script>
fetch('/api/prayer').then(r=>r.json()).then(d=>{
document.getElementById('city').textContent='📍 '+d.city+' - '+d.country;
const arr=Object.entries(d.times);
document.getElementById('list').innerHTML=arr.map(([k,v],i)=>`
<div class="row ${k==='الظهر'?'highlight':''}">
<span class="name">${k}</span>
<span class="time">${v}</span>
</div>`).join('');
});
</script>
</body>
</html>
