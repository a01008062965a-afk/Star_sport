<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدعم الفني</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff}
.card{background:#fff;color:#222;border-radius:16px;padding:22px;max-width:440px;margin:16px auto;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
h2{font-size:18px;margin-bottom:14px;color:#0f2027}
label{display:block;font-size:14px;margin:10px 0 4px;color:#444}
input,textarea{width:100%;padding:12px;font-size:15px;border:2px solid #ddd;border-radius:10px;margin-bottom:8px;font-family:Tahoma}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:#2c5364;outline:none}
button{width:100%;padding:14px;font-size:16px;background:linear-gradient(90deg,#f7971e,#ffd200);color:#222;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:8px;font-family:Tahoma}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:12px;font-size:14px}
.success{background:#e8f5e9;color:#2e7d32;padding:14px;border-radius:10px;text-align:center;font-weight:bold}
.hidden{display:none}
.call-box{background:#e8f5e9;color:#2e7d32;padding:14px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:14px}
</style>
</head>
<body>

<div class="card" id="s1">
<h2>🛠️ الدعم الفني</h2>
<div class="call-box">
📞 للتواصل المباشر:<br>
<a href="https://wa.me/201003658928" style="color:#2e7d32;text-decoration:none;font-weight:bold;direction:ltr;display:inline-block;margin-top:6px">01003658928</a>
</div>
<label>او اكتب رسالتك هنا</label>
<input type="text" id="phone" placeholder="رقم الموبايل">
<input type="text" id="name" placeholder="الاسم (اختياري)">
<textarea id="msg" placeholder="اكتب مشكلتك..."></textarea>
<button onclick="send()">📤 إرسال</button>
<a href="/" class="back">← رجوع للرئيسية</a>
</div>

<div class="card hidden" id="s2">
<div class="success">✅ تم إرسال رسالتك<br><span style="font-size:13px;font-weight:normal">هيتم التواصل معاك قريباً</span></div>
<a href="/" class="back" style="margin-top:14px">← رجوع للرئيسية</a>
</div>

<script>
async function send() {
    var p = document.getElementById('phone').value.trim();
    var m = document.getElementById('msg').value.trim();
    if (!p || !m) return alert('اكمل البيانات');
    await fetch('/api/support', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({phone: p, name: document.getElementById('name').value.trim(), message: m})
    });
    document.getElementById('s1').classList.add('hidden');
    document.getElementById('s2').classList.remove('hidden');
}
</script>
</body>
</html>
